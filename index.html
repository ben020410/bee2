<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/ajax/libs/supabase-js/2.39.0/supabase.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body class="bg-[#F5F5F7] text-[#1D1D1F] min-h-screen p-6 md:p-10 antialiased">

  <!-- 보안 인증 모달 -->
  <div id="auth-modal" class="fixed inset-0 bg-black/30 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-card bg-white/90 p-8 rounded-3xl max-w-sm w-full text-center space-y-5 shadow-2xl">
      <div class="w-12 h-12 bg-[#0071E3]/10 text-[#0071E3] rounded-full flex items-center justify-center mx-auto text-xl">🔒</div>
      <div>
        <h2 class="text-xl font-semibold tracking-tight text-[#1D1D1F]">보안 인증</h2>
        <p class="text-xs text-[#86868B] mt-1">대시보드에 접근하려면 비밀번호를 입력하세요.</p>
      </div>
      <form id="auth-form" onsubmit="checkAuth(event)" class="space-y-3">
        <input type="password" id="auth-passcode" placeholder="비밀번호 입력 (기본: 1234)" required
          class="w-full bg-white border border-black/10 rounded-2xl px-4 py-3 text-center text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/30">
        <button type="submit" class="w-full bg-[#0071E3] text-white py-3 rounded-2xl text-sm font-medium hover:bg-[#0077ED] transition-all shadow-sm">
          잠금 해제
        </button>
      </form>
      <p id="auth-error" class="text-xs text-rose-500 hidden font-medium">비밀번호가 올바르지 않습니다.</p>
    </div>
  </div>

  <!-- 메인 대시보드 화면 -->
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Apple 헤더 -->
    <header class="flex justify-between items-end pb-2 border-b border-black/5">
      <div>
        <h1 class="text-3xl font-semibold tracking-tight text-[#1D1D1F]">Dashboard</h1>
        <p class="text-xs text-[#86868B] mt-1 font-medium">개인 프로젝트 & 타임라인 관리</p>
      </div>
      <div id="status-badge" class="text-xs px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 font-medium border border-emerald-200/60">
        ● 동기화 상태 확인 중...
      </div>
    </header>

    <!-- 상단: 깔끔한 화살표 타임라인 -->
    <section class="glass-card rounded-3xl p-7">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-xs font-semibold text-[#86868B] tracking-wider uppercase">Project Timeline</h2>
          <p class="text-[11px] text-[#86868B] mt-0.5">* 시작일과 화살표 마감일 배지로 프로젝트 기간이 표시됩니다.</p>
        </div>
        <button onclick="toggleProjectModal(true)" class="text-xs bg-[#0071E3] text-white px-3.5 py-1.5 rounded-full font-medium hover:bg-[#0077ED] transition-all">
          + 새 프로젝트 추가
        </button>
      </div>
      <div class="relative my-4">
        <div class="absolute top-1/2 left-0 right-0 h-[2px] bg-black/5 -translate-y-1/2"></div>
        <div id="timeline-container" class="relative z-10 flex justify-around items-center overflow-x-auto py-3 scrollbar-none gap-6">
          <!-- JS에서 화살표 시각화 노드 생성 -->
        </div>
      </div>
    </section>

    <!-- 하단: 세부 정보 및 체크리스트 -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- 프로젝트 상세 카드 (수정 & 삭제 버튼 포함) -->
      <div class="glass-card rounded-3xl p-7 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center">
            <span id="proj-category" class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-black/5 text-[#515154]"></span>
            <div id="proj-action-btns" class="flex gap-1.5">
              <button onclick="openEditProjectModal()" 
                class="text-xs text-[#0071E3] hover:text-[#0077ED] font-medium px-2.5 py-1 rounded-full bg-blue-50 hover:bg-blue-100 border border-blue-200/60 transition-all">
                수정
              </button>
              <button onclick="deleteCurrentProject()" 
                class="text-xs text-rose-500 hover:text-rose-600 font-medium px-2.5 py-1 rounded-full bg-rose-50 hover:bg-rose-100 border border-rose-200/60 transition-all">
                삭제
              </button>
            </div>
          </div>
          <h3 id="proj-title" class="text-2xl font-semibold tracking-tight mt-4 text-[#1D1D1F]"></h3>
          <p id="proj-date" class="text-xs text-[#86868B] mt-2 font-medium"></p>
        </div>
        <div class="mt-8 pt-6 border-t border-black/5">
          <div class="flex justify-between text-xs font-medium mb-2">
            <span class="text-[#86868B]">진행률</span>
            <span id="proj-progress-text" class="text-[#0071E3] font-semibold">0%</span>
          </div>
          <div class="w-full bg-black/5 h-2 rounded-full overflow-hidden">
            <div id="proj-progress-bar" class="bg-[#0071E3] h-full transition-all duration-500 ease-out" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- 체크리스트 카드 -->
      <div class="md:col-span-2 glass-card rounded-3xl p-7">
        <h3 class="text-base font-semibold text-[#1D1D1F] mb-4 tracking-tight">Checklist</h3>
        
        <form id="task-form" class="flex gap-2 mb-6">
          <input type="text" id="task-input" placeholder="새로운 할 일 추가..." required
            class="flex-1 bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm text-[#1D1D1F] focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20 focus:border-[#0071E3] transition-all">
          <button type="submit" class="bg-[#0071E3] hover:bg-[#0077ED] text-white px-5 py-2.5 rounded-2xl text-sm font-medium transition-all shadow-sm">
            추가
          </button>
        </form>

        <div id="task-list" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
          <!-- JS에서 체크리스트 목록 생성 -->
        </div>
      </div>

    </section>
  </div>

  <!-- 새 프로젝트 추가 모달 -->
  <div id="project-modal" class="fixed inset-0 bg-black/30 backdrop-blur-md z-40 hidden flex items-center justify-center p-4">
    <div class="glass-card bg-white/95 p-8 rounded-3xl max-w-md w-full space-y-5 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-semibold text-[#1D1D1F]">새 프로젝트 추가</h3>
        <button onclick="toggleProjectModal(false)" class="text-[#86868B] hover:text-[#1D1D1F] text-sm">✕</button>
      </div>
      <form id="project-form" onsubmit="addProject(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">프로젝트명</label>
          <input type="text" id="new-proj-title" required placeholder="예: 신규 웹사이트 디자인"
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">카테고리</label>
          <input type="text" id="new-proj-category" placeholder="예: 디자인 / 개발 / 개인"
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-[#86868B] mb-1">시작일</label>
            <input type="date" id="new-proj-start" required
              class="w-full bg-white border border-black/10 rounded-2xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
          </div>
          <div>
            <label class="block text-xs font-medium text-[#86868B] mb-1">마감일</label>
            <input type="date" id="new-proj-end" required
              class="w-full bg-white border border-black/10 rounded-2xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="toggleProjectModal(false)" class="flex-1 bg-black/5 hover:bg-black/10 text-[#515154] py-2.5 rounded-2xl text-sm font-medium transition-all">취소</button>
          <button type="submit" class="flex-1 bg-[#0071E3] hover:bg-[#0077ED] text-white py-2.5 rounded-2xl text-sm font-medium transition-all shadow-sm">생성</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 프로젝트 수정 모달 -->
  <div id="edit-project-modal" class="fixed inset-0 bg-black/30 backdrop-blur-md z-40 hidden flex items-center justify-center p-4">
    <div class="glass-card bg-white/95 p-8 rounded-3xl max-w-md w-full space-y-5 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-semibold text-[#1D1D1F]">프로젝트 정보 수정</h3>
        <button onclick="toggleEditProjectModal(false)" class="text-[#86868B] hover:text-[#1D1D1F] text-sm">✕</button>
      </div>
      <form id="edit-project-form" onsubmit="updateProject(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">프로젝트명</label>
          <input type="text" id="edit-proj-title" required
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">카테고리</label>
          <input type="text" id="edit-proj-category"
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-[#86868B] mb-1">시작일</label>
            <input type="date" id="edit-proj-start" required
              class="w-full bg-white border border-black/10 rounded-2xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
          </div>
          <div>
            <label class="block text-xs font-medium text-[#86868B] mb-1">마감일</label>
            <input type="date" id="edit-proj-end" required
              class="w-full bg-white border border-black/10 rounded-2xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="toggleEditProjectModal(false)" class="flex-1 bg-black/5 hover:bg-black/10 text-[#515154] py-2.5 rounded-2xl text-sm font-medium transition-all">취소</button>
          <button type="submit" class="flex-1 bg-[#0071E3] hover:bg-[#0077ED] text-white py-2.5 rounded-2xl text-sm font-medium transition-all shadow-sm">수정 저장</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const DASHBOARD_PASSCODE = "0410";
    const SUPABASE_URL = "https://flyjpdjlpiazdqnewrub.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xEsBEYX5vwGK9-XKKYj7bg_3DE6txaK";

    let supabaseClient = null;
    if (SUPABASE_URL !== "https://flyjpdjlpiazdqnewrub.supabase.co" && SUPABASE_URL.trim() !== "") {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let projects = [];
    let selectedId = null;

    function checkAuth(e) {
      e.preventDefault();
      const input = document.getElementById('auth-passcode').value;
      if (input === DASHBOARD_PASSCODE) {
        sessionStorage.setItem('dashboard_auth', 'true');
        document.getElementById('auth-modal').classList.add('hidden');
        init();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    window.onload = () => {
      if (sessionStorage.getItem('dashboard_auth') === 'true') {
        document.getElementById('auth-modal').classList.add('hidden');
        init();
      }
    };

    async function init() {
      if (supabaseClient) {
        document.getElementById('status-badge').innerText = '● Supabase 실시간 동기화';
        await fetchProjectsFromSupabase();
      } else {
        document.getElementById('status-badge').className = 'text-xs px-3 py-1 rounded-full bg-blue-50 text-blue-600 font-medium border border-blue-200/60';
        document.getElementById('status-badge').innerText = '● 로컬 저장소 영구 동기화중';
        loadFromLocalStorage();
      }
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem('apple_dashboard_projects');
      if (saved) {
        projects = JSON.parse(saved);
      } else {
        projects = [
          {
            id: Date.now().toString(),
            title: "첫 번째 프로젝트",
            category: "개인",
            start_date: "2026-09-20",
            end_date: "2026-09-27",
            tasks: [{ id: "t1", text: "대시보드 기능 점검", completed: true }]
          }
        ];
        saveToLocalStorage();
      }
      render();
    }

    function saveToLocalStorage() {
      localStorage.setItem('apple_dashboard_projects', JSON.stringify(projects));
      render();
    }

    async function fetchProjectsFromSupabase() {
      const { data: projData } = await supabaseClient.from('projects').select('*').order('start_date', { ascending: true });
      const { data: taskData } = await supabaseClient.from('tasks').select('*');

      if (projData) {
        projects = projData.map(p => ({
          ...p,
          tasks: taskData ? taskData.filter(t => t.project_id === p.id) : []
        }));
        render();
      }
    }

    // --- 시작일 텍스트 + 화살표 마감일 배지 타임라인 렌더링 ---
    function render() {
      projects.sort((a, b) => new Date(a.start_date) - new Date(b.start_date));

      const container = document.getElementById('timeline-container');
      container.innerHTML = '';

      if (projects.length === 0) {
        container.innerHTML = `<p class="text-xs text-[#86868B] py-4">등록된 프로젝트가 없습니다.</p>`;
        document.getElementById('proj-title').innerText = "프로젝트 없음";
        document.getElementById('proj-category').innerText = "-";
        document.getElementById('proj-date').innerText = "";
        document.getElementById('proj-progress-text').innerText = "0%";
        document.getElementById('proj-progress-bar').style.width = "0%";
        document.getElementById('task-list').innerHTML = `<p class="text-xs text-[#86868B] text-center py-4">프로젝트를 먼저 생성해 주세요.</p>`;
        document.getElementById('proj-action-btns').classList.add('hidden');
        return;
      }

      document.getElementById('proj-action-btns').classList.remove('hidden');

      if (!selectedId || !projects.some(p => p.id === selectedId)) {
        selectedId = projects[0].id;
      }

      projects.forEach(p => {
        const isSelected = p.id === selectedId;
        const btn = document.createElement('button');
        btn.className = 'flex flex-col items-center group focus:outline-none flex-shrink-0 px-2';
        btn.onclick = () => { selectedId = p.id; render(); };
        
        // 1) 상단: 시작일 텍스트만 표시
        // 2) 중앙: 시작 포인트(dot) -> 화살표 줄기 -> 마감일 뱃지 시각화
        btn.innerHTML = `
          <span class="text-[11px] font-semibold tracking-tight transition-colors mb-1.5 ${isSelected ? 'text-[#0071E3]' : 'text-[#86868B] group-hover:text-[#1D1D1F]'}">
            ${p.start_date}
          </span>
          <div class="flex items-center my-1">
            <div class="w-3.5 h-3.5 rounded-full border-2 transition-all ${isSelected ? 'bg-[#0071E3] border-[#0071E3] scale-110 ring-4 ring-[#0071E3]/15' : 'bg-white border-black/25 group-hover:border-black/40'}"></div>
            <div class="h-[2px] w-3 ${isSelected ? 'bg-[#0071E3]' : 'bg-black/15'}"></div>
            <div class="text-[10px] font-medium px-2 py-0.5 rounded-full transition-all flex items-center gap-1 ${
              isSelected ? 'bg-[#0071E3] text-white shadow-sm font-semibold' : 'bg-black/5 text-[#86868B] border border-black/5 group-hover:bg-black/10'
            }">
              <span>➔</span>
              <span>${p.end_date}</span>
            </div>
          </div>
          <span class="text-xs mt-2 px-3.5 py-1 rounded-full font-medium transition-all ${
            isSelected ? 'bg-[#0071E3]/10 text-[#0071E3] font-semibold border border-[#0071E3]/20' : 'bg-white/80 text-[#515154] border border-black/5 group-hover:bg-white'
          }">${p.title}</span>
        `;
        container.appendChild(btn);
      });

      const current = projects.find(p => p.id === selectedId);
      if (!current) return;

      document.getElementById('proj-title').innerText = current.title;
      document.getElementById('proj-category').innerText = current.category || '일반';
      document.getElementById('proj-date').innerText = `기간: ${current.start_date} ~ ${current.end_date}`;

      const total = current.tasks ? current.tasks.length : 0;
      const done = current.tasks ? current.tasks.filter(t => t.completed).length : 0;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('proj-progress-text').innerText = `${pct}%`;
      document.getElementById('proj-progress-bar').style.width = `${pct}%`;

      const taskList = document.getElementById('task-list');
      taskList.innerHTML = '';
      (current.tasks || []).forEach(t => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-3.5 rounded-2xl bg-white/80 border border-black/5 shadow-2xs hover:border-black/10 transition-all';
        div.innerHTML = `
          <label class="flex items-center gap-3 cursor-pointer flex-1">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.id}', ${t.completed})" 
              class="w-4 h-4 rounded-md text-[#0071E3] focus:ring-0 border-black/20 accent-[#0071E3]">
            <span class="text-sm font-medium ${t.completed ? 'line-through text-[#86868B]' : 'text-[#1D1D1F]'}">${t.text}</span>
          </label>
          <button onclick="deleteTask('${t.id}')" class="text-xs text-[#86868B] hover:text-rose-500 font-medium px-2 py-1">삭제</button>
        `;
        taskList.appendChild(div);
      });
    }

    // --- 프로젝트 수정 모달 오픈 & 저장 처리 ---
    function openEditProjectModal() {
      const current = projects.find(p => p.id === selectedId);
      if (!current) return;

      document.getElementById('edit-proj-title').value = current.title;
      document.getElementById('edit-proj-category').value = current.category || '';
      document.getElementById('edit-proj-start').value = current.start_date;
      document.getElementById('edit-proj-end').value = current.end_date;

      toggleEditProjectModal(true);
    }

    function toggleEditProjectModal(show) {
      const modal = document.getElementById('edit-project-modal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    async function updateProject(e) {
      e.preventDefault();
      const title = document.getElementById('edit-proj-title').value.trim();
      const category = document.getElementById('edit-proj-category').value.trim() || '개인';
      const startDate = document.getElementById('edit-proj-start').value;
      const endDate = document.getElementById('edit-proj-end').value;

      if (supabaseClient) {
        await supabaseClient.from('projects').update({
          title, category, start_date: startDate, end_date: endDate
        }).eq('id', selectedId);
        await fetchProjectsFromSupabase();
      } else {
        const current = projects.find(p => p.id === selectedId);
        if (current) {
          current.title = title;
          current.category = category;
          current.start_date = startDate;
          current.end_date = endDate;
          saveToLocalStorage();
        }
      }

      toggleEditProjectModal(false);
    }

    async function deleteCurrentProject() {
      const current = projects.find(p => p.id === selectedId);
      if (!current) return;

      if (confirm(`'${current.title}' 프로젝트를 삭제하시겠습니까?\n포함된 세부 체크리스트도 함께 삭제됩니다.`)) {
        if (supabaseClient) {
          await supabaseClient.from('projects').delete().eq('id', selectedId);
          selectedId = null;
          await fetchProjectsFromSupabase();
        } else {
          projects = projects.filter(p => p.id !== selectedId);
          selectedId = null;
          saveToLocalStorage();
        }
      }
    }

    function toggleProjectModal(show) {
      const modal = document.getElementById('project-modal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    async function addProject(e) {
      e.preventDefault();
      const title = document.getElementById('new-proj-title').value.trim();
      const category = document.getElementById('new-proj-category').value.trim() || '개인';
      const startDate = document.getElementById('new-proj-start').value;
      const endDate = document.getElementById('new-proj-end').value;

      if (supabaseClient) {
        const { data } = await supabaseClient.from('projects').insert([{
          title, category, start_date: startDate, end_date: endDate
        }]).select();
        if (data) selectedId = data[0].id;
        await fetchProjectsFromSupabase();
      } else {
        const newProj = {
          id: Date.now().toString(),
          title,
          category,
          start_date: startDate,
          end_date: endDate,
          tasks: []
        };
        projects.push(newProj);
        selectedId = newProj.id;
        saveToLocalStorage();
      }

      document.getElementById('project-form').reset();
      toggleProjectModal(false);
    }

    async function toggleTask(taskId, currentStatus) {
      if (supabaseClient) {
        await supabaseClient.from('tasks').update({ completed: !currentStatus }).eq('id', taskId);
        await fetchProjectsFromSupabase();
      } else {
        const current = projects.find(p => p.id === selectedId);
        const task = current.tasks.find(t => t.id === taskId);
        if (task) task.completed = !task.completed;
        saveToLocalStorage();
      }
    }

    async function deleteTask(taskId) {
      if (supabaseClient) {
        await supabaseClient.from('tasks').delete().eq('id', taskId);
        await fetchProjectsFromSupabase();
      } else {
        const current = projects.find(p => p.id === selectedId);
        current.tasks = current.tasks.filter(t => t.id !== taskId);
        saveToLocalStorage();
      }
    }

    document.getElementById('task-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text || !selectedId) return;

      if (supabaseClient) {
        await supabaseClient.from('tasks').insert([{ project_id: selectedId, text, completed: false }]);
        input.value = '';
        await fetchProjectsFromSupabase();
      } else {
        const current = projects.find(p => p.id === selectedId);
        if (current) {
          current.tasks.push({ id: Date.now().toString(), text, completed: false });
          input.value = '';
          saveToLocalStorage();
        }
      }
    };
  </script>
</body>
</html>
