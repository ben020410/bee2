<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 개인 프라이빗 대시보드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #F8FAFC; }
  </style>
</head>
<body class="text-slate-800 p-4 md:p-8 min-h-screen">

  <!-- 🔒 PIN 번호 잠금 화면 모달 -->
  <div id="lockScreen" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center space-y-5">
      <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-slate-800">프라이빗 대시보드</h2>
        <p class="text-xs text-slate-400 mt-1">접속하려면 PIN 번호 4자리를 입력하세요.</p>
      </div>
      <input type="password" id="pinInput" maxlength="4" placeholder="••••" 
             class="w-full text-center text-3xl font-bold tracking-[1em] py-3 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 outline-none"
             onkeypress="if(event.key === 'Enter') checkPin()">
      <button onclick="checkPin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition">
        잠금 해제
      </button>
      <p id="pinError" class="text-xs text-rose-500 hidden">PIN 번호가 올바르지 않습니다.</p>
    </div>
  </div>

  <!-- 대시보드 본문 -->
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- 헤더 -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          📊 AI 프라이빗 대시보드
          <span id="syncStatus" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 font-normal">연결 중...</span>
        </h1>
        <p class="text-slate-500 text-sm mt-1">자연어로 대시보드를 실시간 조작하세요.</p>
      </div>
      <!-- 🔑 Gemini API 키 입력 영역 -->
      <div class="flex items-center gap-2 w-full md:w-auto">
        <input type="password" id="geminiKeyInput" placeholder="Gemini API Key 입력" 
               class="px-3 py-2 border rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-300 w-full md:w-48">
        <button onclick="saveGeminiKey()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-2 rounded-xl transition whitespace-nowrap">키 저장</button>
        <button onclick="lockApp()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-xl transition flex items-center gap-1.5 whitespace-nowrap">
          <i class="fa-solid fa-lock"></i> 잠그기
        </button>
      </div>
    </header>

    <!-- 자연어 입력 바 -->
    <section class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 p-[2px] rounded-2xl shadow-md">
      <div class="bg-white p-4 rounded-[14px] flex flex-col md:flex-row gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-wand-magic-sparkles absolute left-4 top-3.5 text-indigo-400"></i>
          <input type="text" id="promptInput" 
                 placeholder="예: '웹 개편 마감일 이틀 밀어줘', 'DB 마이그레이션 업무 추가해줘'" 
                 class="w-full pl-11 pr-4 py-3 bg-slate-50 rounded-xl text-sm border-none focus:ring-2 focus:ring-indigo-400 outline-none"
                 onkeypress="if(event.key === 'Enter') processPrompt()">
        </div>
        <button id="submitBtn" onclick="processPrompt()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-xl transition flex items-center justify-center gap-2">
          <span>명령 실행</span>
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </div>
    </section>

    <!-- KPI 카드 영역 -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-blue-50 border border-blue-100 p-5 rounded-2xl">
        <span class="text-blue-600 text-sm font-semibold">전체 업무</span>
        <div id="kpiTotal" class="text-3xl font-extrabold text-blue-900 mt-2">0</div>
      </div>
      <div class="bg-amber-50 border border-amber-100 p-5 rounded-2xl">
        <span class="text-amber-600 text-sm font-semibold">진행 중</span>
        <div id="kpiInProgress" class="text-3xl font-extrabold text-amber-900 mt-2">0</div>
      </div>
      <div class="bg-emerald-50 border border-emerald-100 p-5 rounded-2xl">
        <span class="text-emerald-600 text-sm font-semibold">완료</span>
        <div id="kpiCompleted" class="text-3xl font-extrabold text-emerald-900 mt-2">0</div>
      </div>
      <div class="bg-rose-50 border border-rose-100 p-5 rounded-2xl">
        <span class="text-rose-600 text-sm font-semibold">마감 임박 (D-3 이내)</span>
        <div id="kpiImpending" class="text-3xl font-extrabold text-rose-900 mt-2">0</div>
      </div>
    </section>

    <!-- 차트 영역 -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-slate-700 font-bold mb-4 text-sm flex items-center gap-2">
          <i class="fa-solid fa-chart-pie text-indigo-400"></i> 상태별 현황
        </h3>
        <div class="h-64 flex justify-center items-center">
          <canvas id="statusChart"></canvas>
        </div>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-slate-700 font-bold mb-4 text-sm flex items-center gap-2">
          <i class="fa-solid fa-chart-simple text-indigo-400"></i> 우선순위별 현황
        </h3>
        <div class="h-64 flex justify-center items-center">
          <canvas id="priorityChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 업무 목록 테이블 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-6 border-b border-slate-100">
        <h3 class="text-slate-800 font-bold">업무 목록</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-400 text-xs uppercase font-semibold">
              <th class="py-3 px-6">프로젝트</th>
              <th class="py-3 px-6">업무명</th>
              <th class="py-3 px-6">마감일</th>
              <th class="py-3 px-6">D-Day</th>
              <th class="py-3 px-6">우선순위</th>
              <th class="py-3 px-6">상태</th>
              <th class="py-3 px-6">메모</th>
            </tr>
          </thead>
          <tbody id="taskTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    // ⚙️ DB 접속 정보 및 PIN 번호만 고정 세팅
    const CONFIG = {
      MY_PIN: "0410",                                            // 🔒 비밀번호 4자리
      SUPABASE_URL: "https://flyjpdjlpiazdqnewrub.supabase.co",   // 🌐 Supabase URL
      SUPABASE_ANON: "sb_publishable_xEsBEYX5vwGK9-XKKYj7bg_3DE6txaK", // 🔑 Supabase Key
      DB_EMAIL: "not@email.com",                                 // 📧 DB 계정
      DB_PASS: "123456"                                          // 🔐 DB 비밀번호
    };

    let dashboardState = {
      kpis: { total: 0, inProgress: 0, completed: 0, impending: 0 },
      tasks: [],
      chartData: { byStatus: { "대기": 0, "진행중": 0, "완료": 0 }, byPriority: { "높음": 0, "보통": 0, "낮음": 0 } }
    };

    let supabaseClient = null;
    let currentUser = null;
    let statusChartInstance = null;
    let priorityChartInstance = null;

    const pastelColors = { blue: '#A8DADC', pink: '#FFB7B2', yellow: '#FFE5B4', green: '#B5EAD7', purple: '#C7CEEA', gray: '#E2E8F0' };

    window.onload = () => {
      // 기존에 저장된 Gemini API 키 불러오기
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('geminiKeyInput').value = savedKey;

      if (localStorage.getItem('app_unlocked') === 'true') {
        document.getElementById('lockScreen').classList.add('hidden');
        initApp();
      }
    };

    function saveGeminiKey() {
      const key = document.getElementById('geminiKeyInput').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        alert('Gemini API 키가 안전하게 브라우저에 저장되었습니다!');
      } else {
        alert('API 키를 입력해주세요.');
      }
    }

    function checkPin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === CONFIG.MY_PIN) {
        localStorage.setItem('app_unlocked', 'true');
        document.getElementById('lockScreen').classList.add('hidden');
        document.getElementById('pinError').classList.add('hidden');
        initApp();
      } else {
        document.getElementById('pinError').classList.remove('hidden');
        document.getElementById('pinInput').value = '';
      }
    }

    function lockApp() {
      localStorage.removeItem('app_unlocked');
      document.getElementById('lockScreen').classList.remove('hidden');
      document.getElementById('pinInput').value = '';
    }

    async function initApp() {
      await connectSupabase();
      renderDashboard(dashboardState);
    }

    async function connectSupabase() {
      try {
        const { createClient } = supabase;
        supabaseClient = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON);

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: CONFIG.DB_EMAIL,
          password: CONFIG.DB_PASS
        });

        if (error) throw error;

        currentUser = data.user;
        updateSyncStatus("실시간 DB 연결됨", "bg-emerald-100 text-emerald-700");
        await fetchFromDb();

      } catch (err) {
        console.error("Supabase 연결 에러:", err);
        updateSyncStatus("DB 연결 실패", "bg-rose-100 text-rose-700");
      }
    }

    function updateSyncStatus(text, bgClass) {
      const statusEl = document.getElementById('syncStatus');
      statusEl.innerText = text;
      statusEl.className = `text-xs px-2.5 py-1 rounded-full font-normal ${bgClass}`;
    }

    async function fetchFromDb() {
      if (!supabaseClient || !currentUser) return;
      const { data } = await supabaseClient
        .from('user_dashboards')
        .select('state')
        .eq('user_id', currentUser.id)
        .single();

      if (data && data.state) {
        dashboardState = data.state;
        renderDashboard(dashboardState);
      }
    }

    async function saveToDb(newState) {
      if (!supabaseClient || !currentUser) return;
      await supabaseClient.from('user_dashboards').upsert({
        user_id: currentUser.id,
        state: newState,
        updated_at: new Date().toISOString()
      });
    }

    function renderDashboard(state) {
      document.getElementById('kpiTotal').innerText = state.kpis.total || 0;
      document.getElementById('kpiInProgress').innerText = state.kpis.inProgress || 0;
      document.getElementById('kpiCompleted').innerText = state.kpis.completed || 0;
      document.getElementById('kpiImpending').innerText = state.kpis.impending || 0;

      const tbody = document.getElementById('taskTableBody');
      tbody.innerHTML = '';
      (state.tasks || []).forEach(task => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';
        const pBadge = task.priority === '높음' ? 'bg-rose-100 text-rose-700' : task.priority === '보통' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600';
        const sBadge = task.status === '완료' ? 'bg-emerald-100 text-emerald-700' : task.status === '진행중' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600';

        tr.innerHTML = `
          <td class="py-4 px-6 font-medium text-slate-500">${task.project}</td>
          <td class="py-4 px-6 font-semibold text-slate-800">${task.task}</td>
          <td class="py-4 px-6 text-slate-500">${task.deadline}</td>
          <td class="py-4 px-6 font-bold text-indigo-600">${task.dDay}</td>
          <td class="py-4 px-6"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${pBadge}">${task.priority}</span></td>
          <td class="py-4 px-6"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${sBadge}">${task.status}</span></td>
          <td class="py-4 px-6 text-slate-400 text-xs">${task.memo || '-'}</td>
        `;
        tbody.appendChild(tr);
      });

      renderCharts(state.chartData);
    }

    function renderCharts(chartData) {
      const ctxStatus = document.getElementById('statusChart').getContext('2d');
      if (statusChartInstance) statusChartInstance.destroy();
      statusChartInstance = new Chart(ctxStatus, {
        type: 'doughnut',
        data: {
          labels: Object.keys(chartData.byStatus),
          datasets: [{ data: Object.values(chartData.byStatus), backgroundColor: [pastelColors.yellow, pastelColors.blue, pastelColors.green], borderWidth: 0 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      });

      const ctxPriority = document.getElementById('priorityChart').getContext('2d');
      if (priorityChartInstance) priorityChartInstance.destroy();
      priorityChartInstance = new Chart(ctxPriority, {
        type: 'bar',
        data: {
          labels: Object.keys(chartData.byPriority),
          datasets: [{ data: Object.values(chartData.byPriority), backgroundColor: [pastelColors.pink, pastelColors.purple, pastelColors.gray], borderRadius: 8 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });
    }

    async function processPrompt() {
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('geminiKeyInput').value.trim();
      const promptInput = document.getElementById('promptInput');
      const userPrompt = promptInput.value.trim();

      if (!apiKey) {
        alert('우측 상단에 Gemini API 키를 입력하고 [키 저장]을 눌러주세요!');
        return;
      }
      if (!userPrompt) return;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 처리 중...`;

      const today = new Date().toISOString().split('T')[0];

      const systemInstruction = `
너는 프로젝트 관리 대시보드의 상태(State)를 업데이트하는 AI 엔진이다.
사용자의 자연어 요청, 현재 대시보드 JSON 상태, 그리고 오늘 날짜 정보를 받는다.

[역할 및 규칙]
1. 입력받은 기존 대시보드 JSON 데이터를 바탕으로 사용자의 자연어 명령을 반영하여 업데이트된 새 JSON 전체를 생성해라.
2. D-Day는 기준 날짜(${today})와 마감일(deadline, YYYY-MM-DD)의 차이를 계산하여 'D-3', 'D+2', 'D-Day' 형태로 입력해라.
3. kpis와 chartData는 tasks 상태 변화에 맞춰 정확하게 자동 재계산해라.
   - kpis: total(전체), inProgress(진행중), completed(완료), impending(D-Day가 D-3 ~ D-Day 사이인 미완료 업무)
   - chartData.byStatus: {"대기": n, "진행중": n, "완료": n}
   - chartData.byPriority: {"높음": n, "보통": n, "낮음": n}
4. 반드시 제공된 스키마 형식에 맞는 순수 JSON 객체만 반환해라.
      `;

      const payload = {
        systemInstruction: { parts: [{ text: systemInstruction }] },
        contents: [{ role: "user", parts: [{ text: `[오늘 날짜]: ${today}\n[현재 상태]: ${JSON.stringify(dashboardState)}\n[사용자 명령]: ${userPrompt}` }] }],
        generationConfig: { responseMimeType: "application/json" }
      };

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const newDashboardState = JSON.parse(data.candidates[0].content.parts[0].text);

        dashboardState = newDashboardState;
        renderDashboard(dashboardState);
        await saveToDb(dashboardState);
        promptInput.value = '';

      } catch (err) {
        alert('오류 발생: ' + err.message);
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>명령 실행</span><i class="fa-solid fa-paper-plane text-xs"></i>`;
      }
    }
  </script>
</body>
</html>
