<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom, 1rem); /* 아이폰 하단 홈 바 여백 대응 */
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.04);
  }
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  
  /* 아이폰 입력 시 화면 자동 확대 방지 (최소 16px 유지) */
  input[type="text"], 
  input[type="password"], 
  input[type="date"], 
  input[type="url"], 
  select, 
  textarea {
    font-size: 16px !important;
  }
  
  /* 드래그 중인 아이템 스타일 */
  .dragging {
    opacity: 0.4;
    transform: scale(0.98);
  }
</style>
</head>
<body class="bg-[#F5F5F7] text-[#1D1D1F] min-h-screen p-4 md:p-10 antialiased">

  <!-- 보안 인증 모달 -->
  <div id="auth-modal" class="fixed inset-0 bg-black/30 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glass-card bg-white/90 p-8 rounded-3xl max-w-sm w-full text-center space-y-5 shadow-2xl">
      <div class="w-12 h-12 bg-[#0071E3]/10 text-[#0071E3] rounded-full flex items-center justify-center mx-auto text-xl">🔒</div>
      <div>
        <h2 class="text-xl font-semibold tracking-tight text-[#1D1D1F]">보안 인증</h2>
        <p class="text-xs text-[#86868B] mt-1">대시보드에 접근하려면 비밀번호를 입력하세요.</p>
      </div>
      <form onsubmit="checkAuth(event)" class="space-y-3">
        <input type="password" id="auth-passcode" placeholder="비밀번호 입력" required
          class="w-full bg-white border border-black/10 rounded-2xl px-4 py-3 text-center text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/30">
        <button type="submit" class="w-full bg-[#0071E3] text-white py-3 rounded-2xl text-sm font-medium hover:bg-[#0077ED] transition-all shadow-sm">
          잠금 해제
        </button>
      </form>
      <p id="auth-error" class="text-xs text-rose-500 hidden font-medium">비밀번호가 올바르지 않습니다.</p>
    </div>
  </div>

  <!-- 메인 대시보드 화면 -->
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Apple 스타일 헤더 -->
    <header class="flex justify-between items-end pb-3 border-b border-black/5">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-[#1D1D1F]">🐝Bee</h1>
        <p id="header-subtitle" class="text-xs text-[#86868B] mt-1 font-medium">프로젝트 & 실시간 타임라인 대시보드</p>
      </div>
      <div class="flex items-center gap-2 md:gap-3">
        <div id="status-badge" class="text-xs px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 font-medium border border-emerald-200/60 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 실시간 연결됨
        </div>
        <button id="view-toggle-btn" onclick="toggleArchiveView()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-full font-medium transition-all shadow-sm flex items-center gap-1.5">
          <span>📦</span> <span id="view-toggle-text">프로젝트 아카이브</span>
        </button>
      </div>
    </header>

    <!-- 메인 대시보드 뷰 -->
    <div id="main-view" class="space-y-6">
      <!-- 가로 타임라인 섹션 -->
      <section class="glass-card rounded-3xl p-6 md:p-8">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xs font-bold text-[#86868B] tracking-wider uppercase">Project Timeline</h2>
          <button onclick="toggleModal('project-modal', true)" class="text-xs bg-[#0071E3] text-white px-4 py-2 rounded-full font-medium hover:bg-[#0077ED] transition-all shadow-sm">
            + 새 프로젝트 추가
          </button>
        </div>
        
        <div class="relative py-6">
          <div class="absolute top-1/2 left-0 right-0 h-[2px] bg-black/5 -translate-y-1/2"></div>
          <div id="timeline-container" class="relative z-10 flex items-center overflow-x-auto py-2 scrollbar-none gap-8 min-h-[100px] px-2">
            <!-- JS에서 타임라인 노드 생성 -->
          </div>
        </div>
      </section>

      <!-- 프로젝트 상세 정보 & 체크리스트 (items-start로 프로젝트 박스 세로길이 고정) -->
      <section class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        
        <!-- 프로젝트 상세 카드 -->
        <div class="glass-card rounded-3xl p-7 flex flex-col justify-between self-start">
          <div>
            <div class="flex justify-between items-center">
              <span id="proj-category" class="text-[11px] font-semibold px-3 py-1 rounded-full bg-black/5 text-[#515154]"></span>
              <div id="proj-action-btns" class="flex gap-1.5 hidden">
                <button onclick="openEditModal()" class="text-xs text-[#0071E3] font-medium px-2.5 py-1 rounded-full bg-blue-50 hover:bg-blue-100 transition-all border border-blue-200/60">수정</button>
                <button onclick="archiveCurrentProject()" class="text-xs text-emerald-600 font-medium px-2.5 py-1 rounded-full bg-emerald-50 hover:bg-emerald-100 transition-all border border-emerald-200/60">보관</button>
                <button onclick="deleteCurrentProject()" class="text-xs text-rose-500 font-medium px-2.5 py-1 rounded-full bg-rose-50 hover:bg-rose-100 transition-all border border-rose-200/60">삭제</button>
              </div>
            </div>
            <h3 id="proj-title" class="text-2xl font-bold tracking-tight mt-4 text-[#1D1D1F] leading-tight"></h3>
            <p id="proj-date" class="text-xs text-[#86868B] mt-1.5 font-medium"></p>
            
            <!-- 대표 링크 바로가기 배지 -->
            <div id="proj-link-container" class="mt-3 hidden">
              <a id="proj-link" href="#" target="_blank" rel="noopener noreferrer" 
                class="inline-flex items-center gap-1.5 text-xs text-[#0071E3] font-medium hover:underline bg-blue-50/80 px-3 py-1 rounded-full border border-blue-100 transition-all">
                <span>🔗 바로가기</span>
                <span class="text-[10px]">↗</span>
              </a>
            </div>
          </div>

          <div class="mt-8 pt-6 border-t border-black/5">
            <div class="flex justify-between text-xs font-medium mb-2">
              <span class="text-[#86868B]">진행률</span>
              <span id="proj-progress-text" class="text-[#0071E3] font-bold">0%</span>
            </div>
            <div class="w-full bg-black/5 h-2 rounded-full overflow-hidden">
              <div id="proj-progress-bar" class="bg-[#0071E3] h-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- 체크리스트 카드 (내용에 따라 확장됨) -->
        <div class="md:col-span-2 glass-card rounded-3xl p-7">
          <h3 class="text-base font-semibold text-[#1D1D1F] mb-4 tracking-tight">Checklist</h3>
          
          <form id="task-form" onsubmit="addTask(event)" class="flex gap-2 mb-6">
            <input type="text" id="task-input" placeholder="새로운 할 일 추가..." required
              class="flex-1 bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20 transition-all">
            <button type="submit" class="bg-[#0071E3] hover:bg-[#0077ED] text-white px-5 py-2.5 rounded-2xl text-sm font-medium transition-all shadow-sm">
              추가
            </button>
          </form>

          <div id="task-list" class="space-y-2.5 max-h-96 overflow-y-auto pr-1">
            <!-- JS에서 체크리스트 목록 생성 -->
          </div>
        </div>

      </section>
    </div>

    <!-- 아카이브 보관함 뷰 (기본 숨김) -->
    <div id="archive-view" class="space-y-6 hidden">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-[#1D1D1F] tracking-tight">📦 보관된 프로젝트</h2>
        <span class="text-xs text-[#86868B]" id="archive-count-badge">0개의 보관된 프로젝트</span>
      </div>

      <div id="archive-container" class="space-y-6">
        <!-- JS에서 아카이브된 프로젝트 카드 생성 -->
      </div>
    </div>

  </div>

  <!-- 새 프로젝트 추가 모달 -->
  <div id="project-modal" class="fixed inset-0 bg-black/30 backdrop-blur-md z-40 hidden flex items-center justify-center p-4">
    <div class="glass-card bg-white/95 p-8 rounded-3xl max-w-md w-full space-y-5 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-semibold text-[#1D1D1F]">새 프로젝트 추가</h3>
        <button onclick="toggleModal('project-modal', false)" class="text-[#86868B] hover:text-[#1D1D1F] text-sm">✕</button>
      </div>
      <form onsubmit="addProject(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">프로젝트명</label>
          <input type="text" id="new-proj-title" required placeholder="예: 신규 기능 개발"
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">카테고리</label>
          <input type="text" id="new-proj-category" placeholder="예: 개발 / 디자인 / 개인"
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">대표 링크 (선택)</label>
          <input type="url" id="new-proj-link" placeholder="https://example.com"
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-[#86868B] mb-1">시작일</label>
            <input type="date" id="new-proj-start" required
              class="w-full bg-white border border-black/10 rounded-2xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
          </div>
          <div>
            <label class="block text-xs font-medium text-[#86868B] mb-1">마감일</label>
            <input type="date" id="new-proj-end" required
              class="w-full bg-white border border-black/10 rounded-2xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="toggleModal('project-modal', false)" class="flex-1 bg-black/5 hover:bg-black/10 text-[#515154] py-2.5 rounded-2xl text-sm font-medium transition-all">취소</button>
          <button type="submit" class="flex-1 bg-[#0071E3] hover:bg-[#0077ED] text-white py-2.5 rounded-2xl text-sm font-medium transition-all shadow-sm">생성</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 프로젝트 수정 모달 -->
  <div id="edit-project-modal" class="fixed inset-0 bg-black/30 backdrop-blur-md z-40 hidden flex items-center justify-center p-4">
    <div class="glass-card bg-white/95 p-8 rounded-3xl max-w-md w-full space-y-5 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-semibold text-[#1D1D1F]">프로젝트 정보 수정</h3>
        <button onclick="toggleModal('edit-project-modal', false)" class="text-[#86868B] hover:text-[#1D1D1F] text-sm">✕</button>
      </div>
      <form onsubmit="updateProject(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">프로젝트명</label>
          <input type="text" id="edit-proj-title" required
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">카테고리</label>
          <input type="text" id="edit-proj-category"
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div>
          <label class="block text-xs font-medium text-[#86868B] mb-1">대표 링크 (선택)</label>
          <input type="url" id="edit-proj-link" placeholder="https://example.com"
            class="w-full bg-white border border-black/10 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-[#86868B] mb-1">시작일</label>
            <input type="date" id="edit-proj-start" required
              class="w-full bg-white border border-black/10 rounded-2xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
          </div>
          <div>
            <label class="block text-xs font-medium text-[#86868B] mb-1">마감일</label>
            <input type="date" id="edit-proj-end" required
              class="w-full bg-white border border-black/10 rounded-2xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#0071E3]/20">
          </div>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="toggleModal('edit-project-modal', false)" class="flex-1 bg-black/5 hover:bg-black/10 text-[#515154] py-2.5 rounded-2xl text-sm font-medium transition-all">취소</button>
          <button type="submit" class="flex-1 bg-[#0071E3] hover:bg-[#0077ED] text-white py-2.5 rounded-2xl text-sm font-medium transition-all shadow-sm">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const DASHBOARD_PASSCODE = "0410";
    const SUPABASE_URL = "https://flyjpdjlpiazdqnewrub.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xEsBEYX5vwGK9-XKKYj7bg_3DE6txaK";

    let supabaseClient = null;
    let projects = [];
    let selectedId = null;
    let isArchiveView = false;

    function initSupabase() {
      if (!supabaseClient) {
        if (window.supabase && window.supabase.createClient) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else {
          console.error("Supabase SDK가 정상 로드되지 않았습니다.");
        }
      }
      return supabaseClient;
    }

    function checkAuth(e) {
      e.preventDefault();
      const input = document.getElementById('auth-passcode').value;
      if (input === DASHBOARD_PASSCODE) {
        sessionStorage.setItem('bee_auth', 'true');
        document.getElementById('auth-modal').classList.add('hidden');
        init();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    window.onload = () => {
      if (sessionStorage.getItem('bee_auth') === 'true') {
        document.getElementById('auth-modal').classList.add('hidden');
        init();
      }
    };

    async function init() {
      initSupabase();
      if (!supabaseClient) return;

      await fetchProjects();
      
      supabaseClient
        .channel('public-db-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, () => fetchProjects())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => fetchProjects())
        .subscribe();
    }

    async function fetchProjects() {
      initSupabase();
      if (!supabaseClient) return;

      try {
        const { data: projData, error: projErr } = await supabaseClient
          .from('projects')
          .select('*')
          .order('start_date', { ascending: true });

        const { data: taskData, error: taskErr } = await supabaseClient
          .from('tasks')
          .select('*')
          .order('created_at', { ascending: true });

        if (projErr) throw projErr;

        projects = (projData || []).map(p => ({
          ...p,
          tasks: (taskData || []).filter(t => t.project_id === p.id)
        }));

        render();
      } catch (err) {
        console.error("Supabase 데이터 연동 오류:", err.message);
      }
    }

    // 메인 대시보드 및 아카이브 뷰 전환
    function toggleArchiveView() {
      isArchiveView = !isArchiveView;
      const mainView = document.getElementById('main-view');
      const archiveView = document.getElementById('archive-view');
      const toggleText = document.getElementById('view-toggle-text');
      const subtitle = document.getElementById('header-subtitle');

      if (isArchiveView) {
        mainView.classList.add('hidden');
        archiveView.classList.remove('hidden');
        toggleText.innerText = "메인 대시보드";
        subtitle.innerText = "보관된 프로젝트 아카이브";
      } else {
        archiveView.classList.add('hidden');
        mainView.classList.remove('hidden');
        toggleText.innerText = "프로젝트 아카이브";
        subtitle.innerText = "프로젝트 & 실시간 타임라인 대시보드";
      }
      render();
    }

    function render() {
      if (isArchiveView) {
        renderArchive();
      } else {
        renderMain();
      }
    }

    function renderMain() {
      const container = document.getElementById('timeline-container');
      const actionBtns = document.getElementById('proj-action-btns');
      if (!container) return;

      container.innerHTML = '';
      const activeProjects = projects.filter(p => !p.is_archived);

      if (activeProjects.length === 0) {
        container.innerHTML = `<p class="text-xs text-[#86868B] py-4 mx-auto">등록된 활성 프로젝트가 없습니다.</p>`;
        document.getElementById('proj-title').innerText = "프로젝트 없음";
        document.getElementById('proj-category').innerText = "-";
        document.getElementById('proj-date').innerText = "";
        document.getElementById('proj-link-container').classList.add('hidden');
        document.getElementById('proj-progress-text').innerText = "0%";
        document.getElementById('proj-progress-bar').style.width = "0%";
        document.getElementById('task-list').innerHTML = `<p class="text-xs text-[#86868B] text-center py-6">프로젝트를 먼저 생성해 주세요.</p>`;
        if (actionBtns) actionBtns.classList.add('hidden');
        return;
      }

      if (actionBtns) actionBtns.classList.remove('hidden');

      if (!selectedId || !activeProjects.some(p => p.id === selectedId)) {
        selectedId = activeProjects[0].id;
      }

      // 1. 타임라인 렌더링
      activeProjects.forEach(p => {
        const isSelected = p.id === selectedId;
        const isSameDate = p.start_date === p.end_date;
        
        const btn = document.createElement('div');
        btn.className = 'flex flex-col items-center group cursor-pointer flex-shrink-0';
        btn.onclick = () => { selectedId = p.id; renderMain(); };

        const deadlineBadge = isSameDate ? '' : `
          <div class="h-[2px] w-3 ${isSelected ? 'bg-[#0071E3]' : 'bg-black/15'}"></div>
          <div class="text-[10px] font-medium px-2 py-0.5 rounded-full flex items-center gap-1 ${
            isSelected ? 'bg-[#0071E3] text-white shadow-xs font-semibold' : 'bg-black/5 text-[#86868B]'
          }">
            <span>➔</span>
            <span>${p.end_date}</span>
          </div>
        `;

        btn.innerHTML = `
          <span class="text-[11px] font-semibold tracking-tight transition-colors mb-1.5 ${isSelected ? 'text-[#0071E3]' : 'text-[#86868B] group-hover:text-[#1D1D1F]'}">
            ${p.start_date}
          </span>
          <div class="flex items-center my-1">
            <div class="w-3.5 h-3.5 rounded-full border-2 transition-all ${isSelected ? 'bg-[#0071E3] border-[#0071E3] scale-110 ring-4 ring-[#0071E3]/15' : 'bg-white border-black/25 group-hover:border-black/40'}"></div>
            ${deadlineBadge}
          </div>
          <span class="text-xs mt-2 px-3.5 py-1 rounded-full font-medium transition-all ${
            isSelected ? 'bg-[#0071E3] text-white font-semibold shadow-md' : 'bg-white/80 text-[#515154] border border-black/5 group-hover:bg-white'
          }">${p.title}</span>
        `;
        container.appendChild(btn);
      });

      // 2. 선택된 프로젝트 상세정보 및 체크리스트
      const current = activeProjects.find(p => p.id === selectedId);
      if (!current) return;

      document.getElementById('proj-title').innerText = current.title;
      document.getElementById('proj-category').innerText = current.category || '일반';
      document.getElementById('proj-date').innerText = current.start_date === current.end_date
        ? `일자: ${current.start_date}`
        : `기간: ${current.start_date} ~ ${current.end_date}`;

      // 대표 링크 노출 처리
      const linkContainer = document.getElementById('proj-link-container');
      const linkBtn = document.getElementById('proj-link');
      if (current.link && current.link.trim() !== '') {
        linkBtn.href = current.link.startsWith('http') ? current.link : `https://${current.link}`;
        linkContainer.classList.remove('hidden');
      } else {
        linkContainer.classList.add('hidden');
      }

      const total = current.tasks ? current.tasks.length : 0;
      const done = current.tasks ? current.tasks.filter(t => t.completed).length : 0;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('proj-progress-text').innerText = `${pct}%`;
      document.getElementById('proj-progress-bar').style.width = `${pct}%`;

      const taskList = document.getElementById('task-list');
      taskList.innerHTML = '';
      
      if (!current.tasks || current.tasks.length === 0) {
        taskList.innerHTML = `<p class="text-xs text-[#86868B] text-center py-6">등록된 할 일이 없습니다.</p>`;
      } else {
        current.tasks.forEach((t, idx) => {
          const div = document.createElement('div');
          div.className = 'flex items-center justify-between p-3.5 rounded-2xl bg-white/80 border border-black/5 shadow-2xs hover:border-black/10 transition-all touch-none select-none';
          div.setAttribute('draggable', 'true');
          
          // PC 마우스 드래그 이벤트
          div.ondragstart = (e) => handleDragStart(e, idx);
          div.ondragover = (e) => handleDragOver(e);
          div.ondrop = (e) => handleDrop(e, idx);
          div.ondragend = (e) => handleDragEnd(e);

          // 모바일 터치 드래그 이벤트
          div.ontouchstart = (e) => handleTouchStart(e, idx);
          div.ontouchmove = (e) => handleTouchMove(e);
          div.ontouchend = (e) => handleTouchEnd(e);

          div.innerHTML = `
            <div class="flex items-center gap-3 flex-1">
              <!-- 드래그 핸들 아이콘 -->
              <span class="cursor-grab active:cursor-grabbing text-[#86868B] hover:text-[#1D1D1F] px-1 text-sm font-bold">⋮⋮</span>
              <label class="flex items-center gap-3 cursor-pointer flex-1">
                <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.id}', ${t.completed})" 
                  class="w-4 h-4 rounded-md text-[#0071E3] focus:ring-0 border-black/20 accent-[#0071E3]">
                <span class="text-sm font-medium ${t.completed ? 'line-through text-[#86868B]' : 'text-[#1D1D1F]'}">${t.text}</span>
              </label>
            </div>
            <button onclick="deleteTask('${t.id}')" class="text-xs text-[#86868B] hover:text-rose-500 font-medium px-2 py-1">삭제</button>
          `;
          taskList.appendChild(div);
        });
      }
    }

    // 아카이브 뷰 렌더링 (높이 고정 및 스크롤바)
    function renderArchive() {
      const container = document.getElementById('archive-container');
      const badge = document.getElementById('archive-count-badge');
      if (!container) return;

      const archivedProjects = projects.filter(p => p.is_archived);
      if (badge) badge.innerText = `${archivedProjects.length}개의 보관된 프로젝트`;

      container.innerHTML = '';

      if (archivedProjects.length === 0) {
        container.innerHTML = `<div class="glass-card rounded-3xl p-12 text-center text-xs text-[#86868B]">보관된 프로젝트가 없습니다.</div>`;
        return;
      }

      archivedProjects.forEach(p => {
        const total = p.tasks ? p.tasks.length : 0;
        const done = p.tasks ? p.tasks.filter(t => t.completed).length : 0;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;

        const linkMarkup = (p.link && p.link.trim() !== '') ? `
          <a href="${p.link.startsWith('http') ? p.link : 'https://' + p.link}" target="_blank" rel="noopener noreferrer" 
            class="inline-flex items-center gap-1 text-xs text-[#0071E3] font-medium hover:underline bg-blue-50/80 px-2.5 py-0.5 rounded-full border border-blue-100">
            <span>🔗 대표 링크</span> ↗
          </a>
        ` : '';

        const card = document.createElement('div');
        card.className = 'glass-card rounded-3xl p-6';
        
        let tasksHtml = '';
        if (!p.tasks || p.tasks.length === 0) {
          tasksHtml = `<p class="text-xs text-[#86868B] text-center py-8">등록된 할 일이 없습니다.</p>`;
        } else {
          p.tasks.forEach(t => {
            tasksHtml += `
              <div class="flex items-center gap-2.5 p-2.5 rounded-xl bg-white/70 border border-black/5 text-xs">
                <span class="${t.completed ? 'text-emerald-500' : 'text-[#86868B]'}">${t.completed ? '✓' : '○'}</span>
                <span class="${t.completed ? 'line-through text-[#86868B]' : 'text-[#1D1D1F]'} flex-1 font-medium">${t.text}</span>
              </div>
            `;
          });
        }

        card.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
            <!-- 고정 높이 프로젝트 카드 -->
            <div class="glass-card bg-white/60 rounded-2xl p-5 h-[280px] flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center">
                  <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-black/5 text-[#515154]">${p.category || '일반'}</span>
                  <div class="flex gap-1.5">
                    <button onclick="unarchiveProject('${p.id}')" class="text-xs text-emerald-600 font-medium px-2.5 py-1 rounded-full bg-emerald-50 hover:bg-emerald-100 transition-all border border-emerald-200/60">복원</button>
                    <button onclick="deleteArchivedProject('${p.id}')" class="text-xs text-rose-500 font-medium px-2.5 py-1 rounded-full bg-rose-50 hover:bg-rose-100 transition-all border border-rose-200/60">삭제</button>
                  </div>
                </div>
                <h3 class="text-xl font-bold tracking-tight mt-3 text-[#1D1D1F]">${p.title}</h3>
                <p class="text-xs text-[#86868B] mt-1 font-medium">${p.start_date === p.end_date ? '일자: ' + p.start_date : '기간: ' + p.start_date + ' ~ ' + p.end_date}</p>
                <div class="mt-2">${linkMarkup}</div>
              </div>

              <div class="pt-4 border-t border-black/5">
                <div class="flex justify-between text-xs font-medium mb-1.5">
                  <span class="text-[#86868B]">완료 진행률</span>
                  <span class="text-[#0071E3] font-bold">${pct}%</span>
                </div>
                <div class="w-full bg-black/5 h-2 rounded-full overflow-hidden">
                  <div class="bg-[#0071E3] h-full" style="width: ${pct}%"></div>
                </div>
              </div>
            </div>

            <!-- 고정 높이 + 스크롤바 체크리스트 박스 -->
            <div class="md:col-span-2 glass-card bg-white/60 rounded-2xl p-5 h-[280px] flex flex-col">
              <h4 class="text-xs font-bold text-[#86868B] uppercase mb-3">Checklist (${p.tasks ? p.tasks.filter(t => t.completed).length : 0}/${p.tasks ? p.tasks.length : 0})</h4>
              <div class="space-y-2 overflow-y-auto flex-1 pr-1">
                ${tasksHtml}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleModal(modalId, show) {
      const modal = document.getElementById(modalId);
      if (modal) {
        if (show) modal.classList.remove('hidden');
        else modal.classList.add('hidden');
      }
    }

    // === 드래그 앤 드롭 (순서 변경) 로직 ===
    let draggedTaskIdx = null;
    let touchStartTaskIdx = null;
    let touchDraggedElem = null;

    // PC 드래그 이벤트
    function handleDragStart(e, index) {
      draggedTaskIdx = index;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e, targetIdx) {
      e.preventDefault();
      if (draggedTaskIdx === null || draggedTaskIdx === targetIdx) return;
      reorderTasks(draggedTaskIdx, targetIdx);
    }

    function handleDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      draggedTaskIdx = null;
    }

    // 모바일 터치 드래그 이벤트
    function handleTouchStart(e, index) {
      touchStartTaskIdx = index;
      touchDraggedElem = e.currentTarget;
      touchDraggedElem.classList.add('dragging');
    }

    function handleTouchMove(e) {
      if (!touchDraggedElem) return;
      // 터치 이동 중 스크롤 방지
      e.preventDefault();
    }

    function handleTouchEnd(e) {
      if (touchStartTaskIdx === null || !touchDraggedElem) return;
      
      const touch = e.changedTouches[0];
      const targetElem = document.elementFromPoint(touch.clientX, touch.clientY);
      const taskContainer = targetElem ? targetElem.closest('[draggable="true"]') : null;

      if (taskContainer && taskContainer.parentNode === touchDraggedElem.parentNode) {
        const children = Array.from(touchDraggedElem.parentNode.children);
        const targetIdx = children.indexOf(taskContainer);
        if (targetIdx !== -1 && targetIdx !== touchStartTaskIdx) {
          reorderTasks(touchStartTaskIdx, targetIdx);
        }
      }

      touchDraggedElem.classList.remove('dragging');
      touchStartTaskIdx = null;
      touchDraggedElem = null;
    }

    // 순서 변경 실행 함수
    function reorderTasks(fromIdx, toIdx) {
      const current = projects.find(p => p.id === selectedId);
      if (!current || !current.tasks) return;

      const [movedTask] = current.tasks.splice(fromIdx, 1);
      current.tasks.splice(toIdx, 0, movedTask);

      renderMain();
    }

    // 프로젝트 생성
    async function addProject(e) {
      e.preventDefault();
      initSupabase();

      if (!supabaseClient) return;

      const title = document.getElementById('new-proj-title').value.trim();
      const category = document.getElementById('new-proj-category').value.trim() || '개인';
      const link = document.getElementById('new-proj-link').value.trim();
      const start_date = document.getElementById('new-proj-start').value;
      const end_date = document.getElementById('new-proj-end').value;

      try {
        const { data, error } = await supabaseClient
          .from('projects')
          .insert([{ title, category, link, start_date, end_date, is_archived: false }])
          .select();

        if (error) throw error;
        if (data && data.length > 0) selectedId = data[0].id;
        
        e.target.reset();
        toggleModal('project-modal', false);
        await fetchProjects();
      } catch (err) {
        alert("프로젝트 생성 오류: " + err.message);
      }
    }

    function openEditModal() {
      const current = projects.find(p => p.id === selectedId);
      if (!current) return;

      document.getElementById('edit-proj-title').value = current.title;
      document.getElementById('edit-proj-category').value = current.category || '';
      document.getElementById('edit-proj-link').value = current.link || '';
      document.getElementById('edit-proj-start').value = current.start_date;
      document.getElementById('edit-proj-end').value = current.end_date;

      toggleModal('edit-project-modal', true);
    }

    // 프로젝트 수정
    async function updateProject(e) {
      e.preventDefault();
      initSupabase();

      const title = document.getElementById('edit-proj-title').value.trim();
      const category = document.getElementById('edit-proj-category').value.trim() || '개인';
      const link = document.getElementById('edit-proj-link').value.trim();
      const start_date = document.getElementById('edit-proj-start').value;
      const end_date = document.getElementById('edit-proj-end').value;

      try {
        const { error } = await supabaseClient
          .from('projects')
          .update({ title, category, link, start_date, end_date })
          .eq('id', selectedId);

        if (error) throw error;

        toggleModal('edit-project-modal', false);
        await fetchProjects();
      } catch (err) {
        alert("프로젝트 수정 오류: " + err.message);
      }
    }

    // 프로젝트 아카이브(보관) 처리
    async function archiveCurrentProject() {
      const current = projects.find(p => p.id === selectedId);
      if (!current) return;

      if (confirm(`'${current.title}' 프로젝트를 아카이브 보관함으로 이동하시겠습니까?`)) {
        try {
          initSupabase();
          const { error } = await supabaseClient
            .from('projects')
            .update({ is_archived: true })
            .eq('id', selectedId);

          if (error) throw error;
          selectedId = null;
          await fetchProjects();
        } catch (err) {
          alert("보관 처리 오류: " + err.message);
        }
      }
    }

    // 아카이브 프로젝트 복원
    async function unarchiveProject(id) {
      try {
        initSupabase();
        const { error } = await supabaseClient
          .from('projects')
          .update({ is_archived: false })
          .eq('id', id);

        if (error) throw error;
        selectedId = id;
        await fetchProjects();
      } catch (err) {
        alert("복원 처리 오류: " + err.message);
      }
    }

    // 아카이브에서 삭제
    async function deleteArchivedProject(id) {
      if (confirm("이 프로젝트를 영구 삭제하시겠습니까?")) {
        try {
          initSupabase();
          await supabaseClient.from('tasks').delete().eq('project_id', id);
          const { error } = await supabaseClient.from('projects').delete().eq('id', id);
          if (error) throw error;
          await fetchProjects();
        } catch (err) {
          alert("삭제 오류: " + err.message);
        }
      }
    }

    // 프로젝트 삭제
    async function deleteCurrentProject() {
      const current = projects.find(p => p.id === selectedId);
      if (!current) return;

      if (confirm(`'${current.title}' 프로젝트를 삭제하시겠습니까?`)) {
        try {
          initSupabase();
          await supabaseClient.from('tasks').delete().eq('project_id', selectedId);
          const { error } = await supabaseClient.from('projects').delete().eq('id', selectedId);
          if (error) throw error;

          selectedId = null;
          await fetchProjects();
        } catch (err) {
          alert("프로젝트 삭제 오류: " + err.message);
        }
      }
    }

    // 체크리스트 추가
    async function addTask(e) {
      e.preventDefault();
      initSupabase();

      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text || !selectedId) return;

      try {
        const { error } = await supabaseClient.from('tasks').insert([{ project_id: selectedId, text, completed: false }]);
        if (error) throw error;

        input.value = '';
        await fetchProjects();
      } catch (err) {
        alert("할 일 추가 오류: " + err.message);
      }
    }

    // 체크박스 상태 변경
    async function toggleTask(taskId, currentStatus) {
      initSupabase();
      try {
        const { error } = await supabaseClient
          .from('tasks')
          .update({ completed: !currentStatus })
          .eq('id', taskId);

        if (error) throw error;
        await fetchProjects();
      } catch (err) {
        alert("체크 상태 변경 오류: " + err.message);
      }
    }

    // 체크리스트 삭제
    async function deleteTask(taskId) {
      initSupabase();
      try {
        const { error } = await supabaseClient.from('tasks').delete().eq('id', taskId);
        if (error) throw error;
        await fetchProjects();
      } catch (err) {
        alert("할 일 삭제 오류: " + err.message);
      }
    }
  </script>
</body>
</html>
